<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Harald's Quest tab icon: the runes ᚼ (Harald) and ᛒ (Bluetooth) joined into one
       bind-rune on a shared stave, carved in gold on night-hall brown (theme "Jelling Gold"). -->
  <defs>
    <radialGradient id="bg" cx=".45" cy=".35" r=".75">
      <stop offset="0" stop-color="#4a2e1a"/>
      <stop offset=".7" stop-color="#22140b"/>
      <stop offset="1" stop-color="#140c07"/>
    </radialGradient>
    <!-- userSpaceOnUse: a straight vertical stroke has zero width, so a bounding-box gradient wouldn't paint it -->
    <linearGradient id="gold" gradientUnits="userSpaceOnUse" x1="0" y1="11" x2="0" y2="53">
      <stop offset="0" stop-color="#fbe9b4"/>
      <stop offset=".55" stop-color="#e2b95c"/>
      <stop offset="1" stop-color="#b8862b"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <rect x="2.5" y="2.5" width="59" height="59" rx="12" fill="none" stroke="#d9ad52" stroke-opacity=".55" stroke-width="1.5"/>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- carved shadow, slightly lower -->
    <g stroke="#000" stroke-opacity=".55" stroke-width="5.5" transform="translate(0 1.4)">
      <path d="M28 11 V53"/>
      <path d="M17 21 L39 43 M39 21 L17 43"/>
      <path d="M28 11 L44 22 L28 32 L44 42 L28 53"/>
    </g>
    <!-- gold strokes: ᚼ (stave + cross) and ᛒ (two pockets) sharing one stave -->
    <g stroke="url(#gold)" stroke-width="5">
      <path d="M28 11 V53"/>
      <path d="M17 21 L39 43 M39 21 L17 43"/>
      <path d="M28 11 L44 22 L28 32 L44 42 L28 53"/>
    </g>
  </g>
</svg>
